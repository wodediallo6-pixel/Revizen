<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RéviZen</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7ff;color:#172033}
header{background:#4b35d5;color:white;padding:30px 20px;border-radius:0 0 25px 25px}
main{max-width:600px;margin:auto;padding:16px}
.card{background:white;padding:20px;margin:15px 0;border-radius:20px}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:12px;background:#4b35d5;color:white;font-size:16px;font-weight:bold}
textarea{width:100%;height:130px;padding:10px;border-radius:10px;border:1px solid #ddd}
h1{margin:0}
</style>
</head>
<body>

<header>
<h1>📚 RéviZen</h1>
<p>Ton cours. Ta fiche. Ta réussite.</p>
</header>

<main>

<div class="card">
<h2>🎓 Choisis ton niveau</h2>
<button>BFEM</button>
<button>Seconde</button>
<button>Première</button>
<button>Terminale</button>
</div>

<div class="card">
<h2>📚 Transforme ton cours</h2>
<p>Colle ton cours ci-dessous :</p>
<textarea placeholder="Écris ou colle ton cours ici..."></textarea>
<button onclick="alert('✨ Ta fiche de révision sera bientôt générée !')">
✨ Créer ma fiche
</button>
</div>

<div class="card">
<h2>🧠 Entraîne-toi</h2>
<button onclick="alert('🧠 Le quiz sera bientôt disponible !')">
Faire un quiz
</button>
</div>

<div class="card">
<h2>🚀 RéviZen</h2>
<p>Révise plus facilement avec l'intelligence artificielle.</p>
</div>

</main>
</body>
</html>
